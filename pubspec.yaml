name: student_task_manager_app
description: A student task manager application.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  lottie: ^3.5.1
  google_fonts: ^8.2.1
  intl: ^0.19.0
  flutter_svg: ^2.0.9
  http: ^1.6.0
  provider: ^6.0.6

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: 13.4.6
  google_sign_in: ^7.2.0

  # Image picker for profile picture
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # UUID for generating task IDs
  uuid: ^4.5.1

  # Shared preferences for local cache/dark mode
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
